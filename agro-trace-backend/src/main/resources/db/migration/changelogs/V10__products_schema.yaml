databaseChangeLog:
  - changeSet:
      id: V10-001
      author: agrotrace
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: lot_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_products_lot
                    references: lots(id)
              - column:
                  name: public_id
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(140)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1500)
              - column:
                  name: crop
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: variety
                  type: varchar(120)
              - column:
                  name: quantity_available
                  type: decimal(10, 3)
                  constraints:
                    nullable: false
              - column:
                  name: unit
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: reference_price
                  type: decimal(12, 2)
              - column:
                  name: currency
                  type: varchar(3)
                  defaultValue: COP
              - column:
                  name: availability_date
                  type: date
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: BORRADOR
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: timestamp
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_products_lot_id
            tableName: products
            columns:
              - column:
                  name: lot_id
        - createIndex:
            indexName: idx_products_status
            tableName: products
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_products_public_id
            tableName: products
            unique: true
            columns:
              - column:
                  name: public_id

  - changeSet:
      id: V10-002
      author: agrotrace
      changes:
        - createTable:
            tableName: product_photos
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_photos_product
                    references: products(id)
              - column:
                  name: url
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: is_cover
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: sort_order
                  type: integer
                  defaultValueNumeric: 0
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_product_photos_product_id
            tableName: product_photos
            columns:
              - column:
                  name: product_id
