databaseChangeLog:
  - changeSet:
      id: V12-001
      author: agrotrace
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_user
                    references: users(id)
              - column:
                  name: total_amount
                  type: decimal(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  defaultValue: COP
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: varchar(100)
              - column:
                  name: shipping_address
                  type: varchar(500)
              - column:
                  name: contact_email
                  type: varchar(255)
              - column:
                  name: contact_phone
                  type: varchar(50)
              - column:
                  name: notes
                  type: varchar(1000)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_orders_user_id
            tableName: orders
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_orders_status
            tableName: orders
            columns:
              - column:
                  name: status

  - changeSet:
      id: V12-002
      author: agrotrace
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_items_order
                    references: orders(id)
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: lot_id
                  type: uuid
              - column:
                  name: product_name
                  type: varchar(140)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: decimal(10, 3)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: decimal(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: decimal(12, 2)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_order_items_order_id
            tableName: order_items
            columns:
              - column:
                  name: order_id

  - changeSet:
      id: V12-003
      author: agrotrace
      changes:
        - createTable:
            tableName: order_status_history
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_status_history_order
                    references: orders(id)
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: changed_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: uuid
              - column:
                  name: notes
                  type: varchar(500)
        - createIndex:
            indexName: idx_order_status_history_order
            tableName: order_status_history
            columns:
              - column:
                  name: order_id
