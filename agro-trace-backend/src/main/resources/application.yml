spring:
  application:
    name: agro-trace-backend
  
  profiles:
    active: dev
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=3600s

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO
    com.agrotrace: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:YWdyb3RyYWNlbWFnZGFsZW5hMjAyNnNlY3JldGtleTEyMw==}
    expiration: 900000
    refresh-expiration: 604800000
  
  storage:
    type: local
    local:
      base-path: ./storage/evidence
    s3:
      bucket: ${AWS_S3_BUCKET:agro-trace-evidence}
      region: ${AWS_REGION:us-east-1}
  
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
