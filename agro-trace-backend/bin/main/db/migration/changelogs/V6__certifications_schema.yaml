databaseChangeLog:
  - changeSet:
      id: V6-001
      author: agrotrace
      changes:
        - createTable:
            tableName: certifications
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: farm_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_certifications_farm
                    references: farms(id)
              - column:
                  name: lot_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_certifications_lot
                    references: lots(id)
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: certifying_entity
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: certification_number
                  type: varchar(100)
              - column:
                  name: issue_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: expiration_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: scope
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: document_url
                  type: varchar(500)
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: modified_by
                  type: uuid
              - column:
                  name: modified_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_certifications_farm_id
            tableName: certifications
            columns:
              - column:
                  name: farm_id
        - createIndex:
            indexName: idx_certifications_lot_id
            tableName: certifications
            columns:
              - column:
                  name: lot_id
